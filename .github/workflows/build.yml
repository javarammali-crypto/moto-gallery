name: Build APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Gallery-v0.2.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gallery v0.2.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: out/*.apk
          make_latest: true

      - name: Publish test build
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Gallery v0.2.${{ github.run_number }} (test build)
          body: |
            Test build for checking new features before they go out to everyone.
            The in-app updater ignores test builds.
          files: out/*.apk
          prerelease: true
          make_latest: false
